<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Surprise Reveal!</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #2c3e50;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Fredoka One', cursive, sans-serif;
            overflow: hidden;
            touch-action: none; /* Prevents zooming and scrolling on touch */
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 2 / 1;
            background-color: #87CEEB;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 10px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let clicks pass through to canvas wrapper */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.9);
            padding: 20px 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            pointer-events: auto;
        }

        h1 {
            color: #333;
            margin: 0 0 15px 0;
            font-size: 28px;
        }

        p {
            color: #666;
            margin: 0 0 20px 0;
            font-size: 16px;
        }

        button {
            background-color: #f1c40f;
            border: none;
            padding: 15px 30px;
            font-size: 20px;
            font-family: 'Fredoka One', cursive;
            color: white;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        #progress-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 20px;
            background-color: rgba(255, 255, 255, 0.5);
            border-radius: 10px;
            border: 3px solid white;
            display: none;
        }

        #progress-bar {
            width: 0%;
            height: 100%;
            background-color: #f1c40f;
            border-radius: 7px;
            transition: width 0.1s linear;
        }

        /* Mobile specific adjustments */
        @media (max-width: 600px) {
            #game-container {
                aspect-ratio: auto;
                height: 100%;
                border-radius: 0;
            }
            h1 { font-size: 22px; }
            p { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="400"></canvas>
        
        <div id="progress-container">
            <div id="progress-bar"></div>
        </div>

        <div id="ui-layer">
            <!-- Start Screen -->
            <div id="start-screen" class="screen" style="display: flex;">
                <h1>¡Gran Noticia!</h1>
                <p>Toca la pantalla para saltar.<br>¡Sobrevive hasta que llegue la cigüeña!</p>
                <button onclick="startGame()">Jugar</button>
            </div>

            <!-- Game Over Screen -->
            <div id="gameover-screen" class="screen">
                <h1>¡Ups!</h1>
                <p>El bebé necesita una siesta. ¡Inténtalo de nuevo!</p>
                <button onclick="resetGame()">Reintentar</button>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const startScreen = document.getElementById('start-screen');
        const gameoverScreen = document.getElementById('gameover-screen');
        const progressContainer = document.getElementById('progress-container');
        const progressBar = document.getElementById('progress-bar');

        // Game Constants
        const GRAVITY = 0.6;
        const JUMP_FORCE = -12;
        const GAME_DURATION = 30000; // 30 seconds to reach boss
        const GROUND_Y = 320;

        // Game State
        let state = 'START'; // START, PLAYING, BOSS, GAMEOVER, WIN
        let animationId;
        let gameTime = 0;
        let lastTime = 0;
        let baseSpeed = 5;
        let particles = [];
        let collectibles = []; // Replaces fallingItems

        // Audio State
        let audioInitialized = false;
        let pingSynth; // Replaces bgmSequence
        let synth;
        let tadaSynth;

        // Entities
        const player = {
            x: 100,
            y: 0,
            width: 40,
            height: 40,
            vy: 0,
            isGrounded: false
        };

        let obstacles = [];
        let clouds = [];
        
        const boss = {
            active: false,
            x: 800,
            y: 200,
            width: 80,
            height: 60,
            speed: 8,
            passed: false
        };

        // Initialize Background Clouds
        for(let i=0; i<5; i++) {
            clouds.push({
                x: Math.random() * 800,
                y: Math.random() * 150 + 20,
                size: Math.random() * 30 + 20,
                speed: Math.random() * 1 + 0.5
            });
        }

        // Initialize Collectible Emojis
        const collectibleEmojis = ['🐣', '🧸', '🍼', '🤱'];

        // --- Audio Setup ---
        function initAudio() {
            if (audioInitialized) return;
            
            pingSynth = new Tone.Synth().toDestination();
            pingSynth.volume.value = -10;
            
            tadaSynth = new Tone.PolySynth(Tone.FMSynth).toDestination();
            tadaSynth.volume.value = -5;

            audioInitialized = true;
        }

        // --- Drawing Functions ---

        function drawPlayer() {
            ctx.save();
            ctx.translate(player.x, player.y);
            
            // Baby Face
            ctx.fillStyle = '#FFE0BD'; // Skin color
            ctx.beginPath();
            ctx.arc(20, 20, 20, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#333';
            ctx.beginPath();
            ctx.arc(12, 15, 3, 0, Math.PI * 2);
            ctx.arc(28, 15, 3, 0, Math.PI * 2);
            ctx.fill();

            // Smile
            ctx.beginPath();
            ctx.arc(20, 22, 8, 0.1, Math.PI - 0.1);
            ctx.stroke();

            // Little hair curl
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(20, 0, 5, Math.PI, 0);
            ctx.stroke();

            ctx.restore();
        }

        function drawObstacle(obs) {
            ctx.save();
            ctx.translate(obs.x, obs.y);
            
            // Draw a baby block (ABC)
            ctx.fillStyle = obs.color || '#E74C3C';
            ctx.fillRect(0, 0, obs.width, obs.height);
            
            ctx.strokeStyle = '#C0392B';
            ctx.lineWidth = 4;
            ctx.strokeRect(0, 0, obs.width, obs.height);

            ctx.fillStyle = 'white';
            ctx.font = 'bold 24px Fredoka One';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('?', obs.width/2, obs.height/2);

            ctx.restore();
        }

        function drawBoss() {
            if (!boss.active) return;
            
            ctx.save();
            ctx.translate(boss.x, boss.y);
            
            // Stork Body
            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.ellipse(40, 30, 40, 20, 0, 0, Math.PI*2);
            ctx.fill();

            // Wing (flapping logic based on time)
            const flap = Math.sin(Date.now() / 100) * 15;
            ctx.beginPath();
            ctx.ellipse(30, 25 - flap, 20, 10, -0.2, 0, Math.PI*2);
            ctx.fillStyle = '#eee';
            ctx.fill();

            // Neck & Head
            ctx.beginPath();
            ctx.arc(10, 15, 12, 0, Math.PI*2);
            ctx.fillStyle = 'white';
            ctx.fill();

            // Beak
            ctx.fillStyle = 'orange';
            ctx.beginPath();
            ctx.moveTo(0, 15);
            ctx.lineTo(-25, 18);
            ctx.lineTo(0, 22);
            ctx.fill();

            // Bundle (Blue, but moving fast)
            ctx.fillStyle = '#3498DB';
            ctx.beginPath();
            ctx.moveTo(-15, 20);
            ctx.lineTo(-25, 40);
            ctx.lineTo(-5, 40);
            ctx.fill();

            ctx.restore();
        }

        function drawBackground() {
            // Sky
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Clouds
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            clouds.forEach(c => {
                ctx.beginPath();
                ctx.arc(c.x, c.y, c.size, 0, Math.PI*2);
                ctx.arc(c.x + c.size*0.8, c.y - c.size*0.3, c.size*0.8, 0, Math.PI*2);
                ctx.arc(c.x + c.size*1.5, c.y, c.size*0.9, 0, Math.PI*2);
                ctx.fill();
            });

            // Ground
            ctx.fillStyle = '#2ECC71';
            ctx.fillRect(0, GROUND_Y, canvas.width, canvas.height - GROUND_Y);
            
            // Grass details
            ctx.fillStyle = '#27AE60';
            ctx.fillRect(0, GROUND_Y, canvas.width, 10);
        }

        function drawCollectibles() {
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            collectibles.forEach(col => {
                ctx.font = col.size + 'px Arial';
                ctx.fillText(col.emoji, col.x + col.width/2, col.y + col.height/2);
            });
        }

        function createConfetti() {
            for(let i=0; i<150; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 15,
                    vy: (Math.random() - 0.5) * 15 - 5,
                    color: Math.random() > 0.5 ? '#3498DB' : '#2980B9', // Blue shades
                    size: Math.random() * 8 + 4,
                    life: 1.0
                });
            }
        }

        function drawWinScreen() {
            // Clear and fill blue
            ctx.fillStyle = '#87CEEB';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Update & Draw Confetti
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.2; // gravity
                p.life -= 0.005;

                ctx.fillStyle = p.color;
                ctx.globalAlpha = Math.max(0, p.life);
                ctx.fillRect(p.x, p.y, p.size, p.size);

                if (p.life <= 0) particles.splice(index, 1);
            });
            ctx.globalAlpha = 1.0;

            // Text
            ctx.fillStyle = '#2C3E50';
            ctx.font = 'bold 60px Fredoka One';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            // Pulsing effect
            const scale = 1 + Math.sin(Date.now() / 200) * 0.05;
            ctx.save();
            ctx.translate(canvas.width/2, canvas.height/2 - 20);
            ctx.scale(scale, scale);
            ctx.fillText("¡ES UN NENE! 💙", 0, 0);
            ctx.restore();

            ctx.font = '24px Fredoka One';
            ctx.fillStyle = '#34495E';
            ctx.fillText("¡Felicidades!", canvas.width/2, canvas.height/2 + 50);
        }

        // --- Game Logic ---

        function jump() {
            if (state !== 'PLAYING' && state !== 'BOSS') return;
            if (player.isGrounded) {
                player.vy = JUMP_FORCE;
                player.isGrounded = false;
            }
        }

        function checkCollision(rect1, rect2) {
            return rect1.x < rect2.x + rect2.width &&
                   rect1.x + rect1.width > rect2.x &&
                   rect1.y < rect2.y + rect2.height &&
                   rect1.y + rect1.height > rect2.y;
        }

        function spawnObstacle() {
            const colors = ['#E74C3C', '#9B59B6', '#F1C40F'];
            obstacles.push({
                x: canvas.width,
                y: GROUND_Y - 40,
                width: 40,
                height: 40,
                color: colors[Math.floor(Math.random() * colors.length)]
            });
        }

        function spawnCollectible() {
             collectibles.push({
                x: canvas.width,
                y: GROUND_Y - 120 - Math.random() * 60, // Floating in the air
                width: 30, // Hitbox width
                height: 30, // Hitbox height
                size: 35, // Font size
                emoji: collectibleEmojis[Math.floor(Math.random() * collectibleEmojis.length)]
             });
        }

        function update(deltaTime) {
            if (state === 'WIN') return;

            // Clouds movement
            clouds.forEach(c => {
                c.x -= c.speed;
                if (c.x + c.size * 2 < 0) {
                    c.x = canvas.width + c.size;
                    c.y = Math.random() * 150 + 20;
                }
            });

            // Player physics
            player.vy += GRAVITY;
            player.y += player.vy;

            if (player.y + player.height >= GROUND_Y) {
                player.y = GROUND_Y - player.height;
                player.vy = 0;
                player.isGrounded = true;
            }

            if (state === 'PLAYING') {
                gameTime += deltaTime;
                let progress = Math.min((gameTime / GAME_DURATION) * 100, 100);
                progressBar.style.width = progress + '%';

                // Difficulty increases over time
                const currentSpeed = baseSpeed + (gameTime / GAME_DURATION) * 5;

                // Obstacle logic
                // Spawn rate gets faster
                const spawnRate = Math.max(1000, 2000 - (gameTime / GAME_DURATION) * 1000);
                
                if (Math.random() < deltaTime / spawnRate) {
                    // Prevent spawning too close to another obstacle
                    if (obstacles.length === 0 || obstacles[obstacles.length-1].x < canvas.width - 200) {
                        spawnObstacle();
                    }
                }

                // Collectible spawning logic
                const collectSpawnRate = 2500; // spawn approx every 2.5 seconds
                if (Math.random() < deltaTime / collectSpawnRate) {
                    spawnCollectible();
                }

                for (let i = obstacles.length - 1; i >= 0; i--) {
                    let obs = obstacles[i];
                    obs.x -= currentSpeed;

                    if (checkCollision(player, obs)) {
                        gameOver();
                    }

                    if (obs.x + obs.width < 0) {
                        obstacles.splice(i, 1);
                    }
                }

                for (let i = collectibles.length - 1; i >= 0; i--) {
                    let col = collectibles[i];
                    col.x -= currentSpeed;

                    if (checkCollision(player, col)) {
                        if (audioInitialized) {
                            pingSynth.triggerAttackRelease("C6", "16n"); // Happy ping
                        }
                        collectibles.splice(i, 1);
                        continue;
                    }

                    if (col.x + col.width < 0) {
                        collectibles.splice(i, 1);
                    }
                }

                // Boss trigger
                if (progress >= 100) {
                    state = 'BOSS';
                    boss.active = true;
                    boss.x = canvas.width;
                    boss.y = GROUND_Y - boss.height - 20; // Low enough to jump over
                    progressContainer.style.display = 'none';
                    obstacles = []; // clear remaining obstacles
                }
            } else if (state === 'BOSS') {
                boss.x -= boss.speed;
                
                if (checkCollision(player, boss)) {
                    gameOver();
                }

                // If stork passed off screen
                if (boss.x + boss.width < 0 && !boss.passed) {
                    boss.passed = true;
                    winGame();
                }
            }
        }

        function draw() {
            if (state === 'WIN') {
                drawWinScreen();
                return;
            }

            drawBackground();
            drawCollectibles();
            drawPlayer();
            
            obstacles.forEach(drawObstacle);
            drawBoss();
        }

        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            if (state === 'PLAYING' || state === 'BOSS' || state === 'WIN') {
                update(deltaTime);
                draw();
            }

            animationId = requestAnimationFrame(gameLoop);
        }

        // --- Controls & Flow ---

        async function startGame() {
            // Audio requires user interaction to start playing
            await Tone.start();
            initAudio();

            startScreen.style.display = 'none';
            progressContainer.style.display = 'block';
            resetPlayer();
            obstacles = [];
            collectibles = [];
            gameTime = 0;
            progressBar.style.width = '0%';
            state = 'PLAYING';
            boss.active = false;
            boss.passed = false;
            lastTime = performance.now();
        }

        function resetGame() {
            gameoverScreen.style.display = 'none';
            startGame();
        }

        function resetPlayer() {
            player.x = 100;
            player.y = GROUND_Y - player.height;
            player.vy = 0;
            player.isGrounded = true;
        }

        function gameOver() {
            state = 'GAMEOVER';
            progressContainer.style.display = 'none';
            gameoverScreen.style.display = 'flex';
        }

        function winGame() {
            if (audioInitialized) {
                // Play "Ta-Da!" fanfare
                const now = Tone.now();
                tadaSynth.triggerAttackRelease(["C4", "E4", "G4"], "8n", now);
                tadaSynth.triggerAttackRelease(["C5", "E5", "G5", "C6"], "2n", now + 0.2);
            }
            
            state = 'WIN';
            createConfetti();
        }

        // Input Listeners
        window.addEventListener('mousedown', jump);
        window.addEventListener('touchstart', (e) => {
            e.preventDefault(); // Prevent default mobile behaviors like zooming
            jump();
        }, { passive: false });

        // Initial setup
        drawBackground();
        drawPlayer();
        animationId = requestAnimationFrame(gameLoop);

    </script>
</body>
</html>
